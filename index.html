<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggleBtn" class="btn-secondary">🌙 Dark Mode</button>
    </header>

    <!-- Total Balance Card -->
    <section class="card balance-card">
      <h2>TOTAL BALANCE</h2>
      <div id="totalBalance" class="balance-amount">$0.00</div>
    </section>

    <div class="grid-layout">
      <!-- Section Form Input -->
      <section class="card form-card">
        <h3>Add Transaction</h3>
        <form id="transactionForm">
          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Cilok" required />
          </div>
          
          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" placeholder="e.g. 14.94" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </section>

      <!-- Section Visual Chart -->
      <section class="card chart-card">
        <h3>Spending by Category</h3>
        <div class="chart-wrapper">
          <canvas id="spendingChart"></canvas>
        </div>
      </section>
    </div>

    <!-- Section Transaction List & Controls -->
    <section class="card list-card">
      <div class="list-header">
        <h3>Transactions</h3>
        <div class="sort-control">
          <label for="sortSelect">Sort by: </label>
          <select id="sortSelect">
            <option value="default">Default (Latest)</option>
            <option value="amount-high">Amount (High to Low)</option>
            <option value="amount-low">Amount (Low to High)</option>
            <option value="category">Category</option>
          </select>
        </div>
      </div>

      <div id="transactionList" class="transaction-list">
        <!-- List items will be rendered dynamically -->
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
